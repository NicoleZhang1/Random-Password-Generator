<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,379;1,379&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="text-container">
        <h1>Generate a <br /><span class="highlight">random password</span></h1>
        <p>Never use an insecure password again.</p>
      </div>
      <button onclick="generatePasswords()">Generate passwords</button>
      <hr />
      <div class="entire-password-container">
        <div class="password-container">
          <p id="password-one-el"></p>
        </div>
        <div class="password-container">
          <p id="password-two-el"></p>
        </div>
      </div>
    </div>
  </body>
</html>
<script src="script.js"></script>
